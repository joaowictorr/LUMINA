  <style>
    /* Estilo específico desta página: grid de 3 colunas (Req 4) */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      /* 3 colunas - Req 4 */
      gap: var(--espaco-sm);
      padding: var(--espaco-md) 0;
    }

    /* cada item é um <figure>: imagem + legenda (título do livro) */
    .item-galeria {
      overflow: hidden;
      border-radius: var(--raio-padrao);
      box-shadow: var(--sombra-suave);
      background-color: var(--cor-fundo-alt);
    }

    .item-estudo-galeria {
      overflow: hidden;
      border-radius: var(--raio-padrao);
      box-shadow: var(--sombra-suave);
      background-color: var(--cor-fundo-alt);
    }
    .item-galeria img {
      width: 100%;
      height: 260px;
      /* mesma altura para todas -> "mesmo tamanho" */
      object-fit: cover;
      /* corta a imagem sem distorcer */
      display: block;
      transition: transform 0.25s ease;
    }

    .item-galeria:hover img {
      transform: scale(1.04);
    }

    .item-galeria figcaption {
      padding: var(--espaco-xs);
      font-size: 0.9rem;
      text-align: center;
      color: var(--cor-texto);
    }

    /* Responsividade: 2 colunas em tablet, 1 em celular (Req 16) */
    @media (max-width: 900px) {
      .galeria-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .galeria-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
